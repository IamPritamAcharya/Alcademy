name: Refresh daily stories

on:
  schedule:
    # 07:43 India time; avoid the busy top of the hour.
    - cron: '13 2 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the generated feed (otherwise preview only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-stories
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test daily feed
        run: python -m unittest discover -s backend/daily_stories -p 'test_*.py'
      - name: Generate daily stories
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python backend/daily_stories/feed.py --publish
          else
            python backend/daily_stories/feed.py
          fi
