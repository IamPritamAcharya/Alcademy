name: Check college notices

on:
  schedule:
    # Offset from the top of the hour. All times are UTC.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview reads the page; baseline saves IDs silently; validate checks Firebase without delivery; check monitors; test sends to the test phone.
        type: choice
        options: [preview, baseline, validate, check, test]
        default: preview
      audience:
        description: Production delivery also requires NOTICE_PRODUCTION_ENABLED=true.
        type: choice
        options: [test, production]
        default: test

permissions:
  contents: write

concurrency:
  group: college-notice-checker
  cancel-in-progress: false

jobs:
  check:
    # Scheduling stays off until explicitly enabled in repository variables.
    if: github.event_name == 'workflow_dispatch' || vars.NOTICE_CHECKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/notice_checker/requirements.txt
      - name: Install Firebase Admin SDK
        run: python -m pip install -r backend/notice_checker/requirements.txt
      - name: Run checker tests
        run: python -m unittest discover -s backend/notice_checker -p 'test_*.py'
      - name: Check notices
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CHECKER_MODE: ${{ inputs.mode || 'check' }}
          CHECKER_AUDIENCE: ${{ inputs.audience || vars.NOTICE_CHECKER_AUDIENCE || 'test' }}
          NOTICE_PRODUCTION_ENABLED: ${{ vars.NOTICE_PRODUCTION_ENABLED || 'false' }}
        run: python backend/notice_checker/checker.py --mode "$CHECKER_MODE" --audience "$CHECKER_AUDIENCE"
